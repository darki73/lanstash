[package]
name = "lanstash-adapter-admin-api"
description = "lanstash adapter: the admin HTTP API and status page, and its client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lanstash-app = { path = "../../app" }
lanstash-domain = { path = "../../domain" }
lanstash-ports = { path = "../../ports" }

[dev-dependencies]
# The client's tests reach an API served by the real HTTP server.
lanstash-adapter-http = { path = "../http" }
lanstash-app = { path = "../../app", features = ["test-support"] }
lanstash-store = { path = "../../store", features = ["test-support"] }

[lints]
workspace = true
