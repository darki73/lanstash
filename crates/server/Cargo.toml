[package]
name = "lanstash"
description = "lanstash: a caching proxy for game downloads. Binary and composition root."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lanstash"
path = "src/main.rs"

[dependencies]
lanstash-domain = { path = "../domain" }
lanstash-ports = { path = "../ports" }
lanstash-store = { path = "../store" }
lanstash-app = { path = "../app" }
lanstash-adapter-admin-api = { path = "../adapters/admin-api" }
lanstash-adapter-dns = { path = "../adapters/dns" }
lanstash-adapter-fs = { path = "../adapters/fs" }
lanstash-adapter-http = { path = "../adapters/http" }
lanstash-adapter-logs = { path = "../adapters/logs" }
lanstash-adapter-names = { path = "../adapters/names" }
lanstash-adapter-os = { path = "../adapters/os" }
lanstash-adapter-sqlite = { path = "../adapters/sqlite" }
lanstash-adapter-crypto = { path = "../adapters/crypto" }
lanstash-battlenet-api = { path = "../platforms/battlenet/api" }
lanstash-battlenet-app = { path = "../platforms/battlenet/app" }
lanstash-battlenet-domain = { path = "../platforms/battlenet/domain" }
lanstash-epic = { path = "../platforms/epic/domain" }
lanstash-epic-app = { path = "../platforms/epic/app" }
lanstash-riot = { path = "../platforms/riot" }
lanstash-dns-adguard = { path = "../dns/adguard" }
lanstash-dns-pihole = { path = "../dns/pihole" }
lanstash-steam-domain = { path = "../platforms/steam/domain" }
lanstash-steam-app = { path = "../platforms/steam/app" }
lanstash-adapter-steam = { path = "../adapters/steam" }

[lints]
workspace = true
