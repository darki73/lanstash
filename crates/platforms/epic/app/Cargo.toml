[package]
name = "lanstash-epic-app"
description = "lanstash's Epic Games use cases over the ports: the accounts signed in (a code from Epic's own page, tokens kept and renewed)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lanstash-app = { path = "../../../app" }
lanstash-domain = { path = "../../../domain" }
lanstash-epic = { path = "../domain" }
lanstash-ports = { path = "../../../ports" }
lanstash-store = { path = "../../../store" }

[dev-dependencies]
# The tests use the in-memory store.
lanstash-store = { path = "../../../store", features = ["test-support"] }

[lints]
workspace = true
