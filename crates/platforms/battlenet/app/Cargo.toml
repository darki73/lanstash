[package]
name = "lanstash-battlenet-app"
description = "lanstash's Battle.net use cases: products, builds, install plans, the catalog, prefill and the nginx-cache probe, over the ports."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lanstash-app = { path = "../../../app" }
lanstash-battlenet-domain = { path = "../domain" }
lanstash-domain = { path = "../../../domain" }
lanstash-ports = { path = "../../../ports" }
lanstash-store = { path = "../../../store" }

[dev-dependencies]
# The integration tests in tests/ use the in-memory doubles.
lanstash-app = { path = "../../../app", features = ["test-support"] }
lanstash-store = { path = "../../../store", features = ["test-support"] }

[lints]
workspace = true
