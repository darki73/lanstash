# A release for a version tag (v0.1.0): every check first, then one archive for Linux x86_64 with the
# binary, the built web UI, the licence and the README, its SHA-256, and a GitHub release holding both.
# The tag must be the version of the `lanstash` crate.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: The tag is the crate's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lanstash") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME is not the lanstash crate's version v$version" >&2
            exit 1
          fi
      - run: cargo build --release --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Package
        run: |
          name="lanstash-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/lanstash LICENSE README.md "$name/"
          cp -r web/dist "$name/web"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "lanstash $GITHUB_REF_NAME" --generate-notes \
            "lanstash-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" "lanstash-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"
